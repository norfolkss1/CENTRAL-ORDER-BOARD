<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen order board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root{
    --bg:#F2F4F0; --panel:#FFFFFF; --ink:#12190F; --ink-soft:#495449; --line:#C6D0C4;
    --veg:#2E5C0C; --veg-bg:#DEEECB; --dry:#7A4B08; --dry-bg:#F5E4C4; --pro:#8A2E12; --pro-bg:#F5DCD1;
    --dai:#0A3F72; --dai-bg:#D7E7F8; --bre:#5E2308; --bre-bg:#E9C3AE; --pas:#651C38; --pas-bg:#F5D8E2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body,html{margin:0;padding:0;background:var(--bg)}
  .board-root{font-family:'Space Grotesk',sans-serif;color:var(--ink);max-width:1100px;margin:0 auto;padding:0.9rem 12px 2rem;font-size:15px}
  .status-bar{font-size:12px;color:var(--ink-soft);font-weight:500;display:flex;align-items:center;gap:5px;padding:0 2px 8px}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#3E8F1C}
  .status-dot.off{background:#C4341F}
  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;padding:0 2px}
  .search-wrap{position:relative;flex:1 1 100%;min-width:180px;order:1}
  .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:17px}
  input[type=text]{width:100%;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;padding:11px 12px 11px 36px;border:1.5px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--ink)}
  input[type=text]::placeholder{color:var(--ink-soft);font-weight:400}
  .row2{display:flex;gap:8px;flex:1 1 100%;order:2;align-items:center;flex-wrap:wrap}
  .name-field{flex:1;min-width:100px}
  .name-field input{width:100%;font-size:13px;padding:8px 10px;padding-left:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:500}
  .name-field.needs-name input{border-color:var(--pro)}
  .icon-btn{font-size:12px;font-weight:600;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;font-family:'Space Grotesk',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .icon-btn:hover{border-color:var(--ink)}
  .icon-btn.admin-on{color:#fff;background:var(--dai);border-color:var(--dai)}
  .jumpchips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 10px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .jumpchips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .chip.active{color:#fff;background:var(--ink);border-color:var(--ink)}
  .chip.veg{border-color:var(--veg);color:var(--veg)} .chip.dry{border-color:var(--dry);color:var(--dry)}
  .chip.pro{border-color:var(--pro);color:var(--pro)} .chip.dai{border-color:var(--dai);color:var(--dai)}
  .chip.bre{border-color:var(--bre);color:var(--bre)} .chip.pas{border-color:var(--pas);color:var(--pas)}
  .chip.veg.active{background:var(--veg);border-color:var(--veg)} .chip.dry.active{background:var(--dry);border-color:var(--dry)}
  .chip.pro.active{background:var(--pro);border-color:var(--pro)} .chip.dai.active{background:var(--dai);border-color:var(--dai)}
  .chip.bre.active{background:var(--bre);border-color:var(--bre)} .chip.pas.active{background:var(--pas);border-color:var(--pas)}
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .col{flex:0 0 88vw;scroll-snap-align:start;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px 2px;border-bottom:1.5px solid var(--line);margin-bottom:8px}
  .col-title{font-size:15px;font-weight:700}
  .col-count{font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);background:var(--bg);border-radius:20px;padding:3px 9px}
  .items{display:flex;flex-direction:column;gap:7px}
  .item{border:1.5px solid var(--line);border-left:5px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel)}
  .item.active{background:var(--bg)}
  .item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .item-name{font-size:14px;font-weight:600;line-height:1.35}
  .item-del{background:none;border:none;color:var(--pro);font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0}
  .stepper{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .stepper button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .stepper button:active{background:var(--line)}
  .qty-readout{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;min-width:26px;text-align:center}
  .item-meta{margin-top:5px;font-size:11px;font-weight:600;color:var(--ink-soft);display:flex;justify-content:space-between}
  .item-comment{margin-top:7px}
  .item-comment input{width:100%;font-size:12px;font-weight:400;padding:7px 9px;border:1.5px dashed var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-family:'Space Grotesk',sans-serif}
  .item-row-top{display:flex;align-items:flex-start;gap:6px}
  .add-item-btn{margin-top:9px;font-size:13px;font-weight:600;color:var(--ink-soft);background:none;border:1.5px dashed var(--line);border-radius:9px;padding:10px;cursor:pointer;font-family:'Space Grotesk',sans-serif;text-align:center}
  .add-form{display:flex;gap:6px;margin-top:9px}
  .add-form input{flex:1;font-size:13px;padding:9px}
  .add-form button{font-size:13px;font-weight:600;padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--ink);color:var(--panel);cursor:pointer;font-family:'Space Grotesk',sans-serif}
  .empty-state{font-size:12px;font-weight:500;color:var(--ink-soft);text-align:center;padding:20px 4px}
  .no-results,.loading{font-size:13px;font-weight:500;color:var(--ink-soft);padding:24px;text-align:center}
  .veg{border-left-color:var(--veg)} .veg .col-count{color:var(--veg)}
  .dry{border-left-color:var(--dry)} .dry .col-count{color:var(--dry)}
  .pro{border-left-color:var(--pro)} .pro .col-count{color:var(--pro)}
  .dai{border-left-color:var(--dai)} .dai .col-count{color:var(--dai)}
  .bre{border-left-color:var(--bre)} .bre .col-count{color:var(--bre)}
  .pas{border-left-color:var(--pas)} .pas .col-count{color:var(--pas)}

  .overlay{position:fixed;inset:0;background:rgba(10,15,10,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:sticky;top:-16px;background:var(--panel);padding-top:4px;z-index:2}
  .sheet-title{font-size:17px;font-weight:700}
  .sheet-close{background:none;border:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:4px}
  .sum-cat-head{font-size:13px;font-weight:700;margin:14px 2px 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
  .sum-cat-head:first-child{margin-top:0}
  .sum-row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-left:5px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;background:var(--bg)}
  .sum-row.checked{opacity:0.5}
  .sum-row.checked .sum-name{text-decoration:line-through}
  .sum-check{flex-shrink:0;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}
  .sum-check.on{background:var(--veg);border-color:var(--veg);color:#fff}
  .sum-body{flex:1;min-width:0}
  .sum-name{font-size:13px;font-weight:600}
  .sum-cat{font-size:10px;font-weight:600;color:var(--ink-soft);display:block;margin-top:2px}
  .sum-comment{font-size:11px;font-style:italic;color:var(--ink-soft);margin-top:3px}
  .sum-right{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;flex-shrink:0}
  .sum-by{font-size:10px;color:var(--ink-soft);font-family:'Space Grotesk',sans-serif;font-weight:600;display:block;margin-top:2px}
  .sum-total{font-size:12px;font-weight:600;color:var(--ink-soft);margin:4px 2px 12px}
  .send-btn{width:100%;padding:13px;border-radius:9px;border:none;background:var(--ink);color:var(--panel);font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;margin-top:8px}
  .send-btn:disabled{opacity:0.4;cursor:not-allowed}
  .hist-entry{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .hist-entry-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .hist-date{font-size:13px;font-weight:700}
  .hist-meta{font-size:11px;font-weight:600;color:var(--ink-soft)}
  .hist-items{margin-top:8px;padding-top:8px;border-top:1.5px solid var(--line);font-size:12px;display:none}
  .hist-items.open{display:block}
  .hist-line{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink-soft);font-weight:500}
  .hist-line .hn{color:var(--ink);font-weight:600}
  .hist-empty,.sum-empty{font-size:13px;font-weight:500;color:var(--ink-soft);text-align:center;padding:20px}

  @media (min-width:720px){
    .board-root{font-size:14px}
    .topbar{flex-wrap:nowrap}
    .search-wrap{flex:1;order:0}
    .row2{flex:0 0 auto;order:0;width:auto}
    .name-field{flex:0 0 130px}
    .col{flex:0 0 240px}
    .stepper button{width:28px;height:28px;font-size:15px}
  }
</style>
</head>
<body>
<div class="board-root">
  <div class="status-bar"><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting…</span></div>
  <div class="topbar">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" id="search" placeholder="Search items" autocomplete="off">
    </div>
    <div class="row2">
      <div class="name-field" id="name-field"><input type="text" id="display-name" placeholder="Your name (required to order)" autocomplete="off"></div>
      <button class="icon-btn" id="history-btn" type="button"><i class="ti ti-history"></i>History</button>
      <button class="icon-btn" id="summary-btn" type="button" style="display:none"><i class="ti ti-clipboard-list"></i>Summary</button>
      <button class="icon-btn" id="admin-btn" type="button"><i class="ti ti-lock"></i>Admin</button>
    </div>
  </div>
  <div class="jumpchips" id="jumpchips"></div>
  <div id="board" class="board"><div class="loading">Loading board…</div></div>
</div>
<div id="modal-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, onSnapshot, updateDoc, setDoc, deleteField, arrayUnion,
  collection, addDoc, getDocs, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqqcXUkCrank_UNwdSwK8zsBEsQP7uIp4",
  authDomain: "central-order-board.firebaseapp.com",
  projectId: "central-order-board",
  storageBucket: "central-order-board.firebasestorage.app",
  messagingSenderId: "131290373437",
  appId: "1:131290373437:web:a732f99e5d22da62113954"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const stateRef = doc(db, "board_state", "current");
const ordersColl = collection(db, "order_history");

const CATALOG = {"Vegetables & Fruits": ["Apple Green", "Asparagus", "Avocado", "Banana", "Basil", "Beetroot", "Berries", "Broccolini", "Capsicum", "Carrot", "Cauliflower", "Celery", "Cherry Tomato", "Chervil", "Chili", "Chives", "Corriander", "Cucumber", "Dill", "Dragon Fruit", "Eggplant", "Fennel", "French Beans", "Garlic - Peel/Whole", "Kale", "Kiwi", "Leek", "Lemon", "Lettuce Radichio", "Lettuce Romain", "Letuce Iceberg", "Lime", "Micross", "Mint", "Mushroom Buton", "Onion: Red/White/Brown", "Orange", "Padron Peppers", "Papaya Green", "Parsley", "Passion Fruit", "Pineapple", "Plum", "Pomegranate", "Potato Finger", "Potato Local", "Purple Potato", "Red Cabbage", "Rock Melon", "Rocket Baby", "Rosemary", "Snow Peas", "Spinach", "Spring Onion", "Strawberry", "Sweet Potato", "Taragon", "Thyme", "Tomato Local", "Watermelon", "Zuchini Green"], "Dry Products": ["Agar-Agar", "Anchovie Black", "Apple Cider Vinegar", "BBQ Sauce", "Baked Beans", "Baking Powder", "Balsamic", "Bay Leaf", "Black Olive", "Black Pepper Whole", "Black Quinoa", "Bran Flakes", "Chia Seeds", "Chick Pea", "Chilli Jam", "Choco Pop", "Cinamon Powder", "Coconut Water", "Condenced Milk", "Corn Flakes", "Corn Starch", "Dry Apricot", "Dry Crunberry", "Egg", "Falafel Frozen", "Fish Sauce", "Flax Seed", "Foul Madames", "French Fries", "Frying Oil", "Gherkin", "Green Olives", "Green Peas Frozen", "Hazelnut", "Honey", "Horseradish Sauce", "Icing Sugar", "Ketchup", "Macaroni", "Maple Syrup", "Mayonaise", "Mustard", "Nutella", "Oil Corn", "Olive Oil", "Panko Breadcrumb", "Paprika", "Peanut", "Peanut Butter Crunchy", "Pecans", "Penne", "Picquilo Peppers", "Pista Stick/whole", "Pomegranat Molases", "Prunes", "Pumpkin Seed", "Red Vinegar", "Rice Vinegar", "Saffron", "Salt Fine", "Salt Maldon", "Sambal Oliek", "Soy Sauce", "Spaghetti", "Squid Ink", "Sushi Rice", "Sweet Potato Fries", "T45 Flour", "Tagliatelle", "Tahina", "Tempura Mix", "Tomato Paste", "Tomato Peeled", "Truffle Oil", "Walnut", "White Vinegar", "Whole Oats", "Worcesteshire Sauce"], "Protein": ["Beef Cold Cuts", "Beef Croqutas", "Beef Cuberoll Prime", "Beef Sausage", "Beef Trimmings", "Cheese Croquetas", "Chicken Breast W/wing", "Chicken Croquetas", "Chicken Sausage", "Chicken Whole", "Cod Fillet", "Lamb Rack", "Salmon Whole", "Shrimp 16/20", "Shrimp U15 With Head", "Smocked Mackrel", "Smocked Salmon", "Squid", "Turkey Bacon"], "Dairy": ["Arabic Cheese", "Brie Cheese", "Burata", "Butter", "Cheddar Cheese", "Cream", "Cream Cheese", "Feta", "Labneh", "Manchego Cheese", "Milk Long Life", "Parmesan", "Provolone", "Ricotta", "Yoghurt"], "Bread": ["Arabic Bread", "Bagel", "Bocadillo Bread", "Brioche", "Burger Bun", "Crystal Bread", "English Muffin", "Grisini", "Lavash", "Slider Bun", "Sourdough", "White Sourdough"], "Pastry": ["Acai", "Arabic Sweet", "Bamboo Leaves", "Banana Chips", "Chia", "Chocolate", "Coco Jalila Chocolate", "Cocoa Powder", "Dates", "Flour", "Frozen Berries", "Fruit Puree", "ME Macaroones", "Oats", "Pinacolada Icecream", "Pistachio Spread", "Sago", "Sugar", "Whipping Cream"]};
const CAT_CLASS = { "Vegetables & Fruits": "veg", "Dry Products": "dry", "Protein": "pro", "Dairy": "dai", "Bread": "bre", "Pastry": "pas" };
const ADMIN_PIN = "2580"; // change this before sharing the app

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let customItems = [];
let requests = {};
let deletedItems = [];
let checkedOrder = {};
let displayName = localStorage.getItem('kb-display-name') || '';
let isAdmin = localStorage.getItem('kb-is-admin') === 'true';
let searchTerm = '';
let summaryFilter = 'All';
let histFilter = 'All';
let histTerm = '';
let commentTimers = {};

document.getElementById('display-name').value = displayName;
updateAdminBtn();
renderChips();

(async () => {
  try{
    const snap = await getDoc(stateRef);
    if (!snap.exists()){
      await setDoc(stateRef, { requests: {}, customItems: [], deletedItems: [], checkedOrder: {} });
    }
  } catch(e){ console.error('Init error', e); }
})();

onSnapshot(stateRef, (snap) => {
  const data = snap.data() || {};
  requests = data.requests || {};
  customItems = data.customItems || [];
  deletedItems = data.deletedItems || [];
  checkedOrder = data.checkedOrder || {};
  setStatus(true);
  render();
}, (err) => { console.error(err); setStatus(false); });

function setStatus(ok){
  document.getElementById('status-dot').classList.toggle('off', !ok);
  document.getElementById('status-text').textContent = ok ? 'Live' : 'Connection lost — retrying';
}

function buildItemList(){
  const list = [];
  for (const cat of Object.keys(CATALOG)){
    for (const name of CATALOG[cat]) list.push({ id: cat.slice(0,3).toLowerCase()+'-'+slug(name), name, category: cat });
  }
  for (const it of customItems) list.push({ id: it.id, name: it.name, category: it.category });
  return list.filter(it => !deletedItems.includes(it.id));
}

function requireName(){
  const v = (displayName || '').trim();
  if (v) return true;
  document.getElementById('name-field').classList.add('needs-name');
  document.getElementById('display-name').focus();
  alert('Please enter your name first — we need to know who is requesting each item.');
  return false;
}

function setQty(id, delta){
  if (!requireName()) return;
  const current = requests[id]?.qty || 0;
  const next = Math.max(0, current + delta);
  const field = 'requests.' + id;
  if (next === 0){
    delete requests[id];
    updateDoc(stateRef, { [field]: deleteField() }).catch(console.error);
  } else {
    const val = { qty: next, unit: 'kg', requestedBy: displayName || 'Unnamed', updatedAt: Date.now(), comment: requests[id]?.comment || '' };
    requests[id] = val;
    updateDoc(stateRef, { [field]: val }).catch(console.error);
  }
  render();
}

function setComment(id, text){
  if (!requests[id]) return;
  requests[id].comment = text;
  clearTimeout(commentTimers[id]);
  commentTimers[id] = setTimeout(() => {
    updateDoc(stateRef, { ['requests.' + id + '.comment']: text }).catch(console.error);
  }, 400);
}

function addCustomItem(category, name){
  name = name.trim();
  if (!name) return;
  const id = 'custom-'+slug(category)+'-'+slug(name)+'-'+Date.now().toString(36);
  const item = { id, name, category };
  customItems.push(item);
  updateDoc(stateRef, { customItems: arrayUnion(item) }).catch(console.error);
  render();
}

function deleteItem(id){
  if (!isAdmin) return;
  if (!confirm('Remove this item from the list for everyone? This cannot be undone.')) return;
  deletedItems.push(id);
  const updates = { deletedItems: arrayUnion(id) };
  if (requests[id]){ delete requests[id]; updates['requests.' + id] = deleteField(); }
  updateDoc(stateRef, updates).catch(console.error);
  render();
}

function toggleChecked(id){
  const next = !checkedOrder[id];
  checkedOrder[id] = next;
  updateDoc(stateRef, { ['checkedOrder.' + id]: next }).catch(console.error);
}

function saveName(v){
  displayName = v;
  localStorage.setItem('kb-display-name', v);
  if (v.trim()) document.getElementById('name-field').classList.remove('needs-name');
}
function updateAdminBtn(){
  const btn = document.getElementById('admin-btn');
  btn.classList.toggle('admin-on', isAdmin);
  btn.innerHTML = isAdmin ? '<i class="ti ti-lock-open"></i>Admin' : '<i class="ti ti-lock"></i>Admin';
  document.getElementById('summary-btn').style.display = isAdmin ? 'flex' : 'none';
}
function handleAdminClick(){
  if (isAdmin){
    if (confirm('Log out of admin mode on this device?')){ isAdmin = false; localStorage.setItem('kb-is-admin','false'); updateAdminBtn(); render(); }
    return;
  }
  const pin = prompt('Enter admin PIN');
  if (pin === null) return;
  if (pin === ADMIN_PIN){ isAdmin = true; localStorage.setItem('kb-is-admin','true'); updateAdminBtn(); render(); }
  else alert('Incorrect PIN.');
}

async function sendOrder(){
  const activeIds = Object.keys(requests);
  if (activeIds.length === 0){ alert('The board has no requested items yet.'); return; }
  if (!confirm('Mark this order as sent? It will be saved to history and the board cleared for everyone.')) return;
  const itemsById = {}; for (const it of buildItemList()) itemsById[it.id] = it;
  const entry = {
    clearedAt: Date.now(),
    clearedBy: displayName || 'Admin',
    items: activeIds.map(id => ({ name: itemsById[id]?.name || id, category: itemsById[id]?.category || 'Unknown', qty: requests[id].qty, requestedBy: requests[id].requestedBy, comment: requests[id].comment || '' }))
  };
  try{
    await addDoc(ordersColl, entry);
    await updateDoc(stateRef, { requests: {}, checkedOrder: {} });
    closeModal();
  } catch(e){ console.error(e); alert('Could not send order — check your connection.'); }
}

function renderChips(){
  const wrap = document.getElementById('jumpchips');
  wrap.innerHTML = '';
  for (const cat of Object.keys(CATALOG)){
    const chip = document.createElement('button');
    chip.type = 'button'; chip.className = 'chip ' + CAT_CLASS[cat]; chip.textContent = cat;
    chip.onclick = () => { const el = document.getElementById('col-' + slug(cat)); if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' }); };
    wrap.appendChild(chip);
  }
}

function render(){
  const boardEl = document.getElementById('board');
  const items = buildItemList();
  const term = searchTerm.trim().toLowerCase();
  const byCategory = {}; for (const cat of Object.keys(CATALOG)) byCategory[cat] = [];
  for (const it of items){ if (term && !it.name.toLowerCase().includes(term)) continue; byCategory[it.category].push(it); }
  for (const cat in byCategory) byCategory[cat].sort((a,b)=>a.name.localeCompare(b.name));

  const anyResults = Object.values(byCategory).some(arr => arr.length > 0);
  if (!anyResults && term){ boardEl.innerHTML = '<div class="no-results">No items match "'+escapeHtml(searchTerm)+'".</div>'; return; }

  boardEl.innerHTML = '';
  for (const cat of Object.keys(CATALOG)){
    const arr = byCategory[cat];
    if (term && arr.length === 0) continue;
    const col = document.createElement('div');
    col.className = 'col ' + CAT_CLASS[cat]; col.id = 'col-' + slug(cat);
    const requestedCount = arr.filter(it => requests[it.id]).length;
    col.innerHTML = '<div class="col-head"><span class="col-title">'+cat+'</span><span class="col-count">'+requestedCount+'/'+arr.length+'</span></div><div class="items" id="items-'+slug(cat)+'"></div>';
    boardEl.appendChild(col);
    const itemsEl = col.querySelector('.items');
    if (arr.length === 0){ itemsEl.innerHTML = '<div class="empty-state">No items yet</div>'; }
    for (const it of arr){
      const req = requests[it.id];
      const row = document.createElement('div');
      row.className = 'item' + (req ? ' active' : '');
      row.innerHTML =
        '<div class="item-row-top"><span class="item-name" style="flex:1">'+escapeHtml(it.name)+'</span>' +
        (isAdmin ? '<button class="item-del" type="button" title="Delete item" data-act="del"><i class="ti ti-trash"></i></button>' : '') +
        '</div>' +
        '<div class="item-top" style="margin-top:4px"><span></span><span class="stepper"><button type="button" aria-label="Decrease" data-act="dec">−</button><span class="qty-readout">'+(req ? req.qty : 0)+'</span><button type="button" aria-label="Increase" data-act="inc">+</button></span></div>' +
        (req ? '<div class="item-meta"><span>'+escapeHtml(req.requestedBy)+'</span><span>'+req.qty+' kg</span></div>' : '') +
        (req ? '<div class="item-comment"><input type="text" placeholder="Add a note (optional)" value="'+escapeHtml(req.comment||'')+'" data-act="comment"/></div>' : '');
      row.querySelector('[data-act="dec"]').onclick = () => setQty(it.id, -1);
      row.querySelector('[data-act="inc"]').onclick = () => setQty(it.id, 1);
      const delBtn = row.querySelector('[data-act="del"]');
      if (delBtn) delBtn.onclick = () => deleteItem(it.id);
      const commentInput = row.querySelector('[data-act="comment"]');
      if (commentInput) commentInput.addEventListener('input', (e) => setComment(it.id, e.target.value));
      itemsEl.appendChild(row);
    }
    if (!term){
      const addBtn = document.createElement('button');
      addBtn.className = 'add-item-btn'; addBtn.type = 'button';
      addBtn.innerHTML = '<i class="ti ti-plus" style="vertical-align:-2px;margin-right:4px"></i>Add item';
      addBtn.onclick = () => {
        addBtn.style.display = 'none';
        const form = document.createElement('div'); form.className = 'add-form';
        form.innerHTML = '<input type="text" placeholder="Item name" /><button type="button">Add</button>';
        const input = form.querySelector('input');
        const submit = () => addCustomItem(cat, input.value);
        form.querySelector('button').onclick = submit;
        input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
        col.appendChild(form); input.focus();
      };
      col.appendChild(addBtn);
    }
  }
}

function openModal(html){
  document.getElementById('modal-root').innerHTML = '<div class="overlay" id="overlay"><div class="sheet">' + html + '</div></div>';
  document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
window.closeModal = closeModal;

// ---- Admin: order summary, grouped by category, with tick-off checklist ----
function renderSummary(){
  const itemsById = {}; for (const it of buildItemList()) itemsById[it.id] = it;
  const all = Object.keys(requests).map(id => ({ id, ...itemsById[id], ...requests[id] })).filter(r => r.name);
  const filtered = summaryFilter === 'All' ? all : all.filter(r => r.category === summaryFilter);

  const chips = ['All', ...Object.keys(CATALOG)].map(c =>
    '<button type="button" class="chip '+(c!=='All'?CAT_CLASS[c]:'')+' '+(summaryFilter===c?'active':'')+'" data-filter="'+escapeHtml(c)+'">'+c+'</button>'
  ).join('');

  let rowsHtml;
  if (filtered.length === 0){
    rowsHtml = '<div class="sum-empty">No requested items in this category.</div>';
  } else if (summaryFilter === 'All'){
    rowsHtml = '';
    for (const cat of Object.keys(CATALOG)){
      const inCat = filtered.filter(r => r.category === cat).sort((a,b)=>a.name.localeCompare(b.name));
      if (inCat.length === 0) continue;
      rowsHtml += '<div class="sum-cat-head" style="color:var(--'+CAT_CLASS[cat]+')">'+cat+' ('+inCat.length+')</div>';
      rowsHtml += inCat.map(sumRowHtml).join('');
    }
  } else {
    rowsHtml = filtered.sort((a,b)=>a.name.localeCompare(b.name)).map(sumRowHtml).join('');
  }

  const checkedCount = filtered.filter(r => checkedOrder[r.id]).length;
  const html =
    '<div class="sheet-head"><span class="sheet-title">Order summary</span><button class="sheet-close" onclick="closeModal()">&times;</button></div>' +
    '<div class="jumpchips" id="sum-chips" style="padding-bottom:10px">' + chips + '</div>' +
    '<div class="sum-total">'+checkedCount+' of '+filtered.length+' ticked off'+(summaryFilter!=='All' ? ' in '+summaryFilter : ' total')+'</div>' +
    '<div id="sum-rows">' + rowsHtml + '</div>' +
    '<button class="send-btn" id="send-order-btn" '+(all.length===0?'disabled':'')+'><i class="ti ti-send" style="vertical-align:-2px;margin-right:5px"></i>Mark sent &amp; clear board</button>';
  openModal(html);
  document.querySelectorAll('#sum-chips .chip').forEach(chip => { chip.onclick = () => { summaryFilter = chip.dataset.filter; renderSummary(); }; });
  document.querySelectorAll('.sum-check').forEach(chk => { chk.onclick = () => { toggleChecked(chk.dataset.id); renderSummary(); }; });
  document.getElementById('send-order-btn').onclick = sendOrder;
}
function sumRowHtml(r){
  const on = !!checkedOrder[r.id];
  return '<div class="sum-row '+(on?'checked':'')+'" style="border-left-color:var(--'+CAT_CLASS[r.category]+')">' +
    '<button type="button" class="sum-check '+(on?'on':'')+'" data-id="'+r.id+'">'+(on?'<i class="ti ti-check"></i>':'')+'</button>' +
    '<div class="sum-body"><span class="sum-name">'+escapeHtml(r.name)+'</span><span class="sum-cat">'+escapeHtml(r.category)+'</span>' +
    (r.comment ? '<div class="sum-comment">"'+escapeHtml(r.comment)+'"</div>' : '') + '</div>' +
    '<div class="sum-right">'+r.qty+' kg<span class="sum-by">'+escapeHtml(r.requestedBy)+'</span></div></div>';
}

// ---- History: colored category filters + search ----
let historyCache = [];
async function openHistory(){
  openModal(historyShell('<div class="loading">Loading…</div>'));
  try{
    const q = query(ordersColl, orderBy('clearedAt', 'desc'), limit(20));
    const snap = await getDocs(q);
    historyCache = [];
    snap.forEach(d => historyCache.push(d.data()));
    renderHistory();
  } catch(e){ console.error(e); openModal(historyShell('<div class="hist-empty">Could not load history.</div>')); }
}
function historyShell(inner){
  const chips = ['All', ...Object.keys(CATALOG)].map(c =>
    '<button type="button" class="chip '+(c!=='All'?CAT_CLASS[c]:'')+' '+(histFilter===c?'active':'')+'" data-hfilter="'+escapeHtml(c)+'">'+c+'</button>'
  ).join('');
  return '<div class="sheet-head"><span class="sheet-title">Order history</span><button class="sheet-close" onclick="closeModal()">&times;</button></div>' +
    '<div class="search-wrap" style="margin-bottom:10px"><i class="ti ti-search"></i><input type="text" id="hist-search" placeholder="Search past items" value="'+escapeHtml(histTerm)+'"/></div>' +
    '<div class="jumpchips" id="hist-chips" style="padding-bottom:10px">' + chips + '</div>' +
    '<div id="hist-body">' + inner + '</div>';
}
function renderHistory(){
  const term = histTerm.trim().toLowerCase();
  const rows = [];
  let idx = 0;
  for (const h of historyCache){
    let its = h.items || [];
    if (histFilter !== 'All') its = its.filter(it => it.category === histFilter);
    if (term) its = its.filter(it => it.name.toLowerCase().includes(term));
    if (its.length === 0) continue;
    const date = new Date(h.clearedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const itemsHtml = its.map(it => '<div class="hist-line"><span class="hn">'+escapeHtml(it.name)+'</span><span>'+it.qty+' kg &middot; '+escapeHtml(it.requestedBy)+'</span></div>').join('');
    rows.push('<div class="hist-entry"><div class="hist-entry-head" data-idx="'+idx+'"><span class="hist-date">'+date+'</span><span class="hist-meta">'+its.length+' items &middot; sent by '+escapeHtml(h.clearedBy)+'</span></div><div class="hist-items open" id="hist-'+idx+'">'+itemsHtml+'</div></div>');
    idx++;
  }
  const inner = rows.length === 0 ? '<div class="hist-empty">No matching orders.</div>' : rows.join('');
  document.getElementById('hist-body').innerHTML = inner;
  document.querySelectorAll('.hist-entry-head').forEach(h => { h.onclick = () => document.getElementById('hist-'+h.dataset.idx).classList.toggle('open'); });
  document.querySelectorAll('#hist-chips .chip').forEach(chip => { chip.onclick = () => { histFilter = chip.dataset.hfilter; document.querySelectorAll('#hist-chips .chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); renderHistory(); }; });
  const s = document.getElementById('hist-search');
  if (s) s.oninput = (e) => { histTerm = e.target.value; renderHistory(); };
}

document.getElementById('search').addEventListener('input', (e) => { searchTerm = e.target.value; render(); });
document.getElementById('display-name').addEventListener('change', (e) => saveName(e.target.value));
document.getElementById('admin-btn').addEventListener('click', handleAdminClick);
document.getElementById('history-btn').addEventListener('click', openHistory);
document.getElementById('summary-btn').addEventListener('click', renderSummary);
</script>
</body>
</html>
